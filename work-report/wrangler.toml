name = "work-report"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 화면과 보고서 생성을 모두 이 워커가 처리한다.
# 주소는 https://work-report.<계정>.workers.dev 가 된다.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "work-report"
# wrangler d1 create work-report 로 만든 뒤 나오는 id를 여기에 붙여넣는다.
database_id = "여기에_D1_데이터베이스_ID"

# 시각은 UTC 기준. 한국 시각에서 9시간을 뺀 값이다.
# 주말·공휴일은 코드가 판단해 건너뛴다.
# 두 cron이 같은 시각이라, 어느 쪽이 부른 것인지는 코드가 cron 문자열의
# 요일 칸으로 가린다 (금요일만 도는 쪽이 주간 보고서).
[triggers]
crons = [
  "0 7 * * *",   # 매일 16:00 KST — 일일 보고서
  "0 7 * * 5"    # 금요일 16:00 KST — 주간 보고서
]

[vars]
AUTHOR = "초등콘텐츠사업부 권호상"
SHORT_AUTHOR = "권호상"
# 개인정보처리방침 페이지에 표시할 문의 이메일. 비워 두면 표시하지 않는다.
# SUPPORT_EMAIL = "you@example.com"

# 아래 값들은 wrangler secret put 으로 넣는다 (파일에 적지 않는다):
#   APP_PASSWORD            앱 로그인 비밀번호
#   SESSION_SECRET          쿠키 서명용 임의 문자열
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   GOOGLE_REFRESH_TOKEN
#   GOOGLE_DRIVE_FOLDER_ID
